name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      # The trained model is not in the repository, so the tests that need it are skipped here;
      # everything else (rules, validation, accounts, analytics, model download) runs.
      - run: python -m pytest -q
        working-directory: backend

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: flutter_app
      - run: flutter analyze --no-fatal-infos
        working-directory: flutter_app
      - run: flutter test
        working-directory: flutter_app
